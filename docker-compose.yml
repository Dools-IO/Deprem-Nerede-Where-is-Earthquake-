# Coolify'da "Docker Compose" olarak kurulduğunda uygulama ve PostgreSQL birlikte ayağa kalkar.
# SERVICE_* değişkenlerini Coolify kendisi üretir (şifre dahil); elle bir şey girmek gerekmez.
# Coolify dışında: SERVICE_USER_POSTGRES ve SERVICE_PASSWORD_POSTGRES değerlerini .env dosyasına yazın.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      # Admin paneli (/admin) şifresi: Coolify 64 karakterlik rastgele değer üretir, Environment Variables sekmesinde görünür
      - ADMIN_TOKEN=${SERVICE_PASSWORD_64_ADMIN}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/deprem
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=deprem
    volumes:
      - deprem-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d deprem"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  deprem-db:
